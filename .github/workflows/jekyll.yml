name: Deploy Jekyll with Polyglot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions to deploy Pages
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run site preflight
        id: preflight
        run: npm run preflight

      - name: Setup Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify build runtime
        run: |
          ruby --version
          bundle --version
          bundle exec jekyll --version

      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build with Jekyll
        id: build
        run: npm run build

      - name: Test with HTML Proofer
        id: html
        run: npm run verify:html

      - name: Check JS bundle size
        id: javascript
        run: npm run verify:js

      - name: Check generated-site accessibility and browser contracts
        id: quality
        run: npm run verify:quality

      - name: Check source and generated product claims
        run: npm run verify:source-claims

      - name: Prove source-claim guard rejects unsafe claims
        run: npm run test:source-claims

      - name: Check 320px browser contracts
        run: npm run verify:browser-320

      - name: Validate routes, metadata, anchors and publication boundaries
        run: npm run verify:routes

      - name: Prove the audit rejects broken output
        run: npm run test:audit

      - name: Write deployment verification report
        if: always()
        shell: pwsh
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HTML_OUTCOME: ${{ steps.html.outcome }}
          JAVASCRIPT_OUTCOME: ${{ steps.javascript.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: ./scripts/ci/write-site-ci-report.ps1 -OutputPath ci-results/site-deployment-verification.md -Preflight $env:PREFLIGHT_OUTCOME -Build $env:BUILD_OUTCOME -Html $env:HTML_OUTCOME -JavaScript $env:JAVASCRIPT_OUTCOME -Quality $env:QUALITY_OUTCOME

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-deployment-verification-${{ github.run_id }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
