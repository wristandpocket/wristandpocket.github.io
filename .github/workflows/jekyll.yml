name: Deploy Jekyll with Polyglot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Daily rebuild so future-dated posts publish without a manual push.
    - cron: "25 8 * * *"
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions to deploy Pages
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run site preflight
        id: preflight
        run: npm run preflight

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify build runtime
        run: |
          ruby --version
          bundle --version
          bundle exec jekyll --version

      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build with Jekyll
        id: build
        run: npm run build

      - name: Test with HTML Proofer
        id: html
        run: npm run verify:html

      - name: Check JS bundle size
        id: javascript
        run: npm run verify:js

      - name: Check generated-site accessibility and browser contracts
        id: quality
        run: npm run verify:quality

      - name: Check source and generated product claims
        run: npm run verify:source-claims

      - name: Prove source-claim guard rejects unsafe claims
        run: npm run test:source-claims

      - name: Check 320px browser contracts
        run: npm run verify:browser-320

      - name: Validate routes, metadata, anchors and publication boundaries
        run: npm run verify:routes

      - name: Prove the audit rejects broken output
        run: npm run test:audit

      - name: Write deployment verification report
        if: always()
        shell: pwsh
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HTML_OUTCOME: ${{ steps.html.outcome }}
          JAVASCRIPT_OUTCOME: ${{ steps.javascript.outcome }}
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
        run: ./scripts/ci/write-site-ci-report.ps1 -OutputPath ci-results/site-deployment-verification.md -Preflight $env:PREFLIGHT_OUTCOME -Build $env:BUILD_OUTCOME -Html $env:HTML_OUTCOME -JavaScript $env:JAVASCRIPT_OUTCOME -Quality $env:QUALITY_OUTCOME

      # IndexNow: list pages whose HTML changed since the last successful submission.
      - name: Restore IndexNow manifest
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-prev
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Plan IndexNow submission
        if: github.event_name != 'pull_request'
        run: node scripts/indexnow.mjs plan --site _site --origin https://wristandpocket.dev --prev .indexnow-prev/manifest.json --out indexnow-plan

      - name: Upload IndexNow plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: indexnow-plan
          path: indexnow-plan/
          retention-days: 3

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-deployment-verification-${{ github.run_id }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download IndexNow plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: indexnow-plan
          path: .indexnow

      # Pages can take a moment to serve the new build after deploy-pages returns.
      - name: Wait for the key file to go live
        run: |
          for i in $(seq 1 12); do
            curl -fsS "https://wristandpocket.dev/$(ls *.txt | grep -E '^[a-f0-9]{32}\.txt$')" >/dev/null && exit 0
            sleep 10
          done
          echo "::error::IndexNow key file is not reachable on wristandpocket.dev"; exit 1

      - name: Submit changed URLs
        run: node scripts/indexnow.mjs submit --dir .indexnow --origin https://wristandpocket.dev

      - name: Remember submitted state
        run: mkdir -p .indexnow-prev && cp .indexnow/manifest.json .indexnow-prev/manifest.json

      - name: Save IndexNow manifest
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-prev
          key: indexnow-${{ github.run_id }}
