name: Deploy Jekyll with Polyglot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions to deploy Pages
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run site preflight
        id: preflight
        run: npm run preflight

      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build with Jekyll
        id: build
        run: npm run build

      - name: Test with HTML Proofer
        id: html
        run: npm run verify:html

      - name: Check JS bundle size
        id: javascript
        run: npm run verify:js

      - name: Write deployment verification report
        if: always()
        shell: pwsh
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          HTML_OUTCOME: ${{ steps.html.outcome }}
          JAVASCRIPT_OUTCOME: ${{ steps.javascript.outcome }}
        run: ./scripts/ci/write-site-ci-report.ps1 -OutputPath ci-results/site-deployment-verification.md -Preflight $env:PREFLIGHT_OUTCOME -Build $env:BUILD_OUTCOME -Html $env:HTML_OUTCOME -JavaScript $env:JAVASCRIPT_OUTCOME

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./_site

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-deployment-verification-${{ github.run_id }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
