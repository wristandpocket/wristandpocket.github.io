{% assign game = include.game %}
<a href="{{ game.url | relative_url }}" class="game-item">
    <div class="game-item__media">
        <img
            src="{{ game.thumbnail | relative_url }}"
            alt="{{ game.title }}"
            class="game-item__screenshot"
            width="1024"
            height="1024"
            loading="{{ include.loading | default: 'lazy' }}"
            decoding="async">
    </div>
    <div class="game-item__body">
        <{{ include.heading | default: "h3" }}>
            <span class="game-title-container">
                {% if game.game_icon %}
                <img src="{{ game.game_icon | relative_url }}" alt="" class="game-icon" width="32" height="32" loading="lazy" decoding="async">
                {% endif %}
                {{ game.title }}
            </span>
            <span class="game-item__badge {% if game.badge_style == 'tamagotchi' %}game-item__badge--tamagotchi{% endif %}">{{ game.badge }}</span>
        </{{ include.heading | default: "h3" }}>
        <p>{{ game.description }}</p>
    </div>
    <div class="project-card-end"><span class="project-status">{{ site.data.site_copy[site.active_lang].status }}</span><span class="project-more">{{ site.data.site_copy[site.active_lang].details }} &rarr;</span></div>
</a>
