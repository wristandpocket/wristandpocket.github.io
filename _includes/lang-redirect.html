<script>
    (function () {
        try {
            var activeLang = '{{ site.active_lang }}';
            var preferredLang = localStorage.getItem('preferred_lang');
            var targetLang = null;
            var supportedLangs = ['en', 'uk', 'ru', 'ko', 'pl'];

            if (preferredLang) {
                if (!supportedLangs.includes(preferredLang)) {
                    localStorage.removeItem('preferred_lang');
                    preferredLang = null;
                } else if (preferredLang !== activeLang) {
                    targetLang = preferredLang;
                }
            } else if (
                activeLang === 'en' &&
                (window.location.pathname === '/' || window.location.pathname === '/index.html') &&
                !navigator.webdriver &&
                !/bot|crawl|spider|slurp|facebookexternalhit|lighthouse|headless|bingpreview|yandex|baidu|duckduckbot|applebot|semrush|ahrefs/i.test(navigator.userAgent || '')
            ) {
                // First-time human visitor on the root English page: match the highest-priority browser language.
                // Do not persist to localStorage so explicit URLs and switching back to EN always work.
                var langs = (navigator.languages && navigator.languages.length)
                    ? navigator.languages
                    : [navigator.language || navigator.userLanguage || ''];
                for (var i = 0; i < langs.length; i++) {
                    var base = String(langs[i] || '').toLowerCase().split('-')[0];
                    if (supportedLangs.includes(base)) {
                        if (base !== activeLang) targetLang = base;
                        break;
                    }
                }
            }

            if (targetLang && targetLang !== activeLang) {
                var currentPath = window.location.pathname;
                var pathWithoutLang = currentPath;
                var match = currentPath.match(/^\/(uk|ru|ko|pl)(\/|$)/);
                if (match) {
                    pathWithoutLang = currentPath.substring(match[0].length);
                    if (!pathWithoutLang.startsWith('/')) {
                        pathWithoutLang = '/' + pathWithoutLang;
                    }
                }

                var prefix = targetLang === 'en' ? '' : '/' + targetLang;
                var nextPath = (prefix + pathWithoutLang).replace(/\/\//g, '/');
                if (nextPath === '') nextPath = '/';

                if (currentPath !== nextPath) {
                    window.location.replace(nextPath + window.location.search + window.location.hash);
                }
            }
        } catch (e) {
            console.warn('Language auto-detect failed:', e);
        }
    })();
</script>
