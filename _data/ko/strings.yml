studio_label: "스튜디오"
studio_tagline: "Wear OS를 다시 위대하게!"
home_meta_title: "Wrist & Pocket Studio - Wear OS 게임"
home_meta_description: "품질, 성능, 노 셔블웨어 원칙을 중심으로 만드는 프리미엄 Wear OS 스마트워치 게임."
games_meta_title: "Wear OS 게임 | Wrist & Pocket Studio"
games_meta_description: "Galaxy Watch, Pixel Watch, Android 스마트워치를 위한 Wrist & Pocket Studio의 오리지널 Wear OS 게임."
games_seo_intro_eyebrow: "Android 스마트워치를 위한 오리지널 게임"
games_seo_intro_title: "폰 게임을 줄인 것이 아니라 손목을 위해 만든 Wear OS 게임."
games_seo_intro_body: "Wrist & Pocket Studio는 Galaxy Watch와 Pixel Watch 같은 Wear OS 기기를 위한 작은 화면 게임을 만듭니다. 모든 프로젝트는 짧은 세션, 읽기 쉬운 원형 화면 UI, 회전 입력, haptics, OLED-friendly 비주얼, 실제 스마트워치 성능 한계를 중심으로 설계됩니다."
games_seo_focus_title: "이 Wear OS 게임들이 다른 이유"
games_seo_session_title: "짧은 플레이 세션에 맞춤"
games_seo_session_body: "이동 중, 대기 중, 짧은 휴식 시간에도 바로 즐길 수 있도록 빠른 루프, 명확한 상태, 단순한 조작을 우선합니다."
games_seo_controls_title: "네이티브 워치 컨트롤"
games_seo_controls_body: "회전 베젤이나 crown 입력을 나중에 붙인 장식이 아니라 핵심 입력 방식으로 다룹니다."
games_seo_battery_title: "배터리를 고려한 디자인"
games_seo_battery_body: "어두운 OLED 표현, 신중한 frame targets, 가벼운 UI로 실제 시계에서도 부담 없는 경험을 유지합니다."
games_seo_compat_title: "현대적인 Wear OS 워치를 위해 제작"
games_seo_compat_body: "현재 컬렉션은 Wear OS 3+와 Android 스마트워치를 대상으로 하며, 원형 safe zones, 발열, touch targets 크기, 짧은 집중 시간, 읽기 쉬운 움직임처럼 wrist hardware에서 중요한 제약을 중심으로 테스트합니다."
games_seo_start_prefix: "시각적인 스마트워치 벤치마크를 원한다면"
games_seo_start_middle: "부터 시작하고, 손목을 위해 만든 재미있는 가상 펫 게임을 원한다면"
games_seo_start_suffix: "를 선택해보세요."
