philosophy_desc: "우리의 목표는 스마트워치 게임을 위대하게 만드는 것입니다! 우리는 대중교통에서 부끄럽지 않게 플레이하고, 친구들에게 자랑스레 보여줄 수 있으며, 정말 직접 즐길 수 있는 고품질 게임을 만듭니다."
