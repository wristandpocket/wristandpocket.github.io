home_meta_title: "Wrist & Pocket Studio - игры для Wear OS"
home_meta_description: "Премиальные игры для смарт-часов Wear OS, созданные с вниманием к качеству, производительности и без дешевого хлама."
games_meta_title: "Игры для Wear OS | Wrist & Pocket Studio"
games_meta_description: "Оригинальные игры для смарт-часов Wear OS, Galaxy Watch, Pixel Watch и Android-часов."
games_seo_intro_eyebrow: "Оригинальные игры для Android-смарт-часов"
games_seo_intro_title: "Игры для Wear OS, созданные для запястья, а не сжатые с телефонов."
games_seo_intro_body: "Wrist & Pocket Studio создает игры для маленьких экранов Wear OS вроде Galaxy Watch и Pixel Watch. Каждый проект рассчитан на короткие сессии, читаемый круглый UI, поворотное управление, haptics, OLED-friendly визуал и реальные лимиты производительности смарт-часов."
games_seo_focus_title: "Чем эти игры для Wear OS отличаются"
games_seo_session_title: "Созданы для коротких сессий"
games_seo_session_body: "Быстрые игровые циклы, понятное состояние и простое управление, чтобы игра работала в дороге, в очереди или во время короткого перерыва."
games_seo_controls_title: "Нативное управление часами"
games_seo_controls_body: "Поворотный безель или crown рассматриваются как полноценный способ ввода, а не как мелкая фишка, добавленная в конце."
games_seo_battery_title: "Дизайн с учетом батареи"
games_seo_battery_body: "Темная OLED-подача, осторожные frame targets и легкий UI помогают опыту оставаться практичным на реальных часах."
games_seo_compat_title: "Создано для современных часов Wear OS"
games_seo_compat_body: "Текущая коллекция ориентирована на Wear OS 3+ и Android-смарт-часы, с тестированием вокруг важных ограничений wrist hardware: круглые safe zones, нагрев, размер touch targets, короткое внимание и читаемое движение."
games_seo_start_prefix: "Начните с"
games_seo_start_middle: "если хотите визуальный бенчмарк смарт-часов, или"
games_seo_start_suffix: "если хотите забавную игру про виртуального питомца, созданную для запястья."
