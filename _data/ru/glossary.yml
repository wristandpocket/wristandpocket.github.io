# Inline glossary for posts: {% include term.html id="<key>" %}
# term = headword shown in the tooltip, def = one or two plain sentences for parents.
softlock:
  term: "Софтлок"
  def: "Тупик в игре: программа не зависла и кнопки нажимаются, но из-за ошибки пройти дальше невозможно. Обычно спасает только перезагрузка."
fps:
  term: "FPS"
  def: "Кадры в секунду. От 30 FPS движение выглядит плавным, ниже 15 картинка дёргается, а 2–10 FPS — это уже слайд-шоу."
render:
  term: "Рендер"
  def: "Отрисовка каждого кадра игры на экране. Чем тяжелее сцена и слабее устройство, тем медленнее рендер и ниже FPS."
ui-ux:
  term: "UI/UX"
  def: "UI — это внешний вид интерфейса (кнопки, экраны, подсказки), UX — насколько удобно и понятно им пользоваться."
bug:
  term: "Баг"
  def: "Ошибка в программе, из-за которой она ведёт себя не так, как задумали разработчики."
