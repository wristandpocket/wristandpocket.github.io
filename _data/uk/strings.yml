studio_label: "Студія"
studio_tagline: "Зробимо Wear OS величним знову!"
home_meta_title: "Wrist & Pocket Studio - ігри для Wear OS"
home_meta_description: "Преміальні ігри для смарт-годинників Wear OS, створені з увагою до якості, продуктивності та без дешевого мотлоху."
games_meta_title: "Ігри для Wear OS | Wrist & Pocket Studio"
games_meta_description: "Оригінальні ігри для смарт-годинників Wear OS, Galaxy Watch, Pixel Watch та Android-годинників."
games_seo_intro_eyebrow: "Оригінальні ігри для Android-смарт-годинників"
games_seo_intro_title: "Ігри для Wear OS, створені для зап'ястя, а не стиснуті з телефонів."
games_seo_intro_body: "Wrist & Pocket Studio створює ігри для малих екранів Wear OS на кшталт Galaxy Watch і Pixel Watch. Кожен проєкт розрахований на короткі сесії, читабельний круглий UI, поворотне керування, haptics, OLED-friendly візуал і реальні ліміти продуктивності смарт-годинників."
games_seo_focus_title: "Чим ці ігри для Wear OS відрізняються"
games_seo_session_title: "Створені для коротких сесій"
games_seo_session_body: "Швидкі ігрові цикли, зрозумілий стан і просте керування, щоб гра працювала в дорозі, в черзі або під час короткої перерви."
games_seo_controls_title: "Нативне керування годинником"
games_seo_controls_body: "Поворотний безель або crown розглядаються як повноцінний спосіб вводу, а не як дрібна фішка, додана в кінці."
games_seo_battery_title: "Дизайн з увагою до батареї"
games_seo_battery_body: "Темна OLED-подача, обережні frame targets і легкий UI допомагають досвіду залишатися практичним на реальних годинниках."
games_seo_compat_title: "Створено для сучасних Wear OS годинників"
games_seo_compat_body: "Поточна колекція орієнтована на Wear OS 3+ та Android-смарт-годинники, з тестуванням навколо важливих обмежень wrist hardware: круглі safe zones, нагрів, розмір touch targets, коротка увага й читабельний рух."
games_seo_start_prefix: "Почніть з"
games_seo_start_middle: "якщо хочете візуальний бенчмарк смарт-годинника, або"
games_seo_start_suffix: "якщо хочете кумедну гру про віртуального улюбленця, створену для зап'ястя."
