# Inline glossary for posts: {% include term.html id="<key>" %}
# term = headword shown in the tooltip, def = one or two plain sentences for parents.
softlock:
  term: "Софтлок"
  def: "Глухий кут у грі: програма не зависла і кнопки натискаються, але через помилку пройти далі неможливо. Зазвичай рятує лише перезавантаження."
fps:
  term: "FPS"
  def: "Кадри за секунду. Від 30 FPS рух виглядає плавним, нижче 15 картинка смикається, а 2–10 FPS — це вже слайд-шоу."
render:
  term: "Рендер"
  def: "Малювання кожного кадру гри на екрані. Що важча сцена і слабший пристрій, то повільніше йде рендер і то нижчий FPS."
ui-ux:
  term: "UI/UX"
  def: "UI — це вигляд інтерфейсу (кнопки, екрани, підказки), UX — наскільки зручно й зрозуміло ним користуватися."
bug:
  term: "Баг"
  def: "Помилка в програмі, через яку вона поводиться не так, як задумали розробники."
