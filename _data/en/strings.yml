games_seo_intro_eyebrow: "Original games for Android smartwatches"
games_seo_intro_title: "Wear OS games built for the wrist, not squeezed down from phones."
games_seo_intro_body: "Wrist & Pocket Studio makes small-screen games for Wear OS devices like Galaxy Watch and Pixel Watch. Every project is designed around short sessions, readable round-screen UI, rotary input, haptics, OLED-friendly visuals, and real smartwatch performance limits."
games_seo_focus_title: "Why these Wear OS games are different"
games_seo_session_title: "Made for tiny sessions"
games_seo_session_body: "Quick loops, clear state, and simple controls so the game works while commuting, waiting, or taking a short break."
games_seo_controls_title: "Native watch controls"
games_seo_controls_body: "Rotary bezel or crown support is treated as a first-class input, not a novelty added after the fact."
games_seo_battery_title: "Battery-aware design"
games_seo_battery_body: "Dark OLED presentation, careful frame targets, and lightweight UI keep the experience practical on real watches."
games_seo_compat_title: "Built for modern Wear OS watches"
games_seo_compat_body: "The current collection targets Wear OS 3+ and Android smartwatches, with testing focused on the constraints that matter on wrist hardware: circular safe zones, heat, touch size, short attention windows, and readable motion."
games_seo_start_prefix: "Start with"
games_seo_start_middle: "if you want a visual smartwatch benchmark, or"
games_seo_start_suffix: "if you want a funny virtual pet game made for your wrist."
